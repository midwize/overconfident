[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "midwize-overconfident"
version = "0.1.0"
description = "把候选项映射到类别上，算出模型的过度自信的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "midwize" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://midwize.github.io"
Repository = "https://github.com/midwize/overconfident"
Issues = "https://github.com/midwize/overconfident/issues"

[project.scripts]
overconfident = "overconfident:main"

[tool.setuptools]
py-modules = ["overconfident"]
